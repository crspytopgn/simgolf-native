[workspace]
resolver = "2"
members = ["crates/sg-core", "crates/simgolf", "crates/sgtool", "crates/sgplay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3

# The course report simulates hundreds of rounds; keep debug builds usable.
[profile.dev]
opt-level = 1
