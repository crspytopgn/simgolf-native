<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimGolf</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0f1a; color: #e8e8f0; font-family: system-ui, sans-serif; overflow: hidden; }
  #glcanvas { display: none; width: 100vw; height: 100vh; outline: none; }
  #picker { max-width: 640px; margin: 12vh auto 0; padding: 0 16px; }
  #picker h1 { font-weight: 600; }
  #picker label { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #3b4a8a; border-radius: 6px; cursor: pointer; }
  #picker input { display: none; }
  #status { margin-top: 16px; color: #b8c0e0; min-height: 1.5em; }
  .note { color: #9098b8; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="picker">
  <h1>SimGolf</h1>
  <p class="note">This page runs the SimGolf port with the game data of <b>your own copy</b> of SimGolf. Pick the game folder
  (the one containing Flics, Sounds and Data). The files are read into this browser tab only; nothing is uploaded.</p>
  <label>Choose your SimGolf game folder<input id="folder" type="file" webkitdirectory directory multiple></label>
  <div id="status"></div>
</div>
<canvas id="glcanvas" tabindex="1"></canvas>
<script src="gl.js"></script>
<script src="simgolf.js"></script>
<script>
  document.getElementById("folder").addEventListener("change", e => sgLoadFolder(e.target.files));
</script>
</body>
</html>
