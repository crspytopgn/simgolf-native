[package]
name = "simgolf"
description = "SimGolf native port: the game (reads the data of your own copy of SimGolf)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sg-core = { path = "../sg-core" }
miniquad = "0.4"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
cpal = { version = "0.15", optional = true }

[features]
default = ["audio"]
# Sound output through the system's audio device (CoreAudio, WASAPI, ALSA). Without it the game runs silent.
audio = ["dep:cpal"]
